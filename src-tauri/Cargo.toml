[package]
name = "filmorganizer"
version = "0.1.2"
description = "Film breakdown and scheduling app"
authors = ["nachobust"]
license = "MIT"
edition = "2021"

[lib]
name = "filmorganizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

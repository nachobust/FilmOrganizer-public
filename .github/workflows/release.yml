# Builds the desktop installers for Windows, macOS and Linux.
#
# - Pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) builds every
#   installer and attaches them to a DRAFT release. Review it on GitHub, then press Publish.
# - "Run workflow" on the Actions tab builds everything without a release; the installers
#   are kept as downloadable workflow artifacts, which is handy for testing.
#
# Free: GitHub Actions costs nothing on public repositories. The installers are unsigned,
# so Windows and macOS show a one-time warning on first launch (see the README).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ''
          - name: macOS (Apple Silicon and Intel)
            platform: macos-latest
            args: --target universal-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: FilmOrganizer ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your computer below.

            - **Windows:** `.msi` or `-setup.exe`
            - **macOS:** `.dmg` (works on Apple Silicon and Intel Macs)
            - **Linux:** `.AppImage` (any distribution) or `.deb` (Debian / Ubuntu)

            These builds are not code-signed, so Windows and macOS show a warning the first
            time you open the app. See "Download" in the README for the one-time steps.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Keep installers as workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FilmOrganizer-${{ runner.os }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
          if-no-files-found: warn

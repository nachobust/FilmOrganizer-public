# Publishes the website in site/ to GitHub Pages (free for public repositories).
# The site is plain HTML and CSS, so it is uploaded as-is with no build step.
#
# One-time setup once the repository is public: Settings → Pages → Source: "GitHub Actions".
# While the repository is private the job is skipped, because Pages needs a public repo on free accounts.
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
